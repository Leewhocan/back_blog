name: SBOM Generation and Security Scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM with CycloneDX
        run: npx @cyclonedx/cyclonedx-npm@latest --output-file bom.xml

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-file
          path: bom.xml
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-file

      - name: Create report directory locally
        run: mkdir -p dependency-check-reports

      - name: OWASP Dependency-Check Scan via Docker
        run: |
          # 首次运行时移除 `--noupdate` 参数，允许下载数据库
          docker run --rm \
            -v "$(pwd):/src" \
            -v "$(pwd)/dependency-check-reports:/reports" \
            owasp/dependency-check:latest \
            --scan /src \
            --project "Express SBOM Demo" \
            --format HTML \
            --format SARIF \
            --out /reports
            # 注意：这里移除了 `--noupdate` 参数

      - name: Debug - List generated files
        run: ls -la dependency-check-reports/

      - name: Upload Dependency-Check reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: dependency-check-reports/
          retention-days: 7

      - name: Upload SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          # 根据 `Debug` 步骤的实际输出，确认最终的 SARIF 文件名
          sarif_file: dependency-check-reports/dependency-check-report.sarif
