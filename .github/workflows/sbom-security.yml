name: SBOM and Security Pipeline
on:
  pull_request:
    branches: [main]

jobs:
  build_and_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      # 1. Подготовка
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      # 2. Установка зависимостей и сборка (если нужно)
      - name: Install dependencies
        run: npm ci

      # 3. Генерация SBOM (аналог Maven phase)
      - name: Generate SBOM with CycloneDX
        run: npx @cyclonedx/cyclonedx-npm@latest --output-file bom.xml

      # 4. Сканирование уязвимостей (аналог dependency-check:check)
      - name: OWASP Dependency Check Scan
        run: |
          # Создаем директорию для отчетов
          mkdir -p target
          # Запускаем проверку зависимостей
          docker run --rm \
            -v "$(pwd):/src" \
            -v "$(pwd)/target:/reports" \
            owasp/dependency-check:latest \
            --scan /src \
            --project "Express SBOM Demo" \
            --format HTML \
            --out /reports \
            --noupdate

      # 5. Загрузка артефактов (отчетов)
      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-file
          path: bom.xml
          retention-days: 7

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html # Аналогично path из примера
          retention-days: 7

  # 6. Опциональный шаг деплоя (если нужно)
  deploy:
    runs-on: ubuntu-latest # или self-hosted, как в примере
    needs: build_and_scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Пример условия
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t express_app:latest .
      - name: Run Docker Image
        run: |
          docker run -d --name myapp -p 3000:3000 express_app:latest
          sleep 5
          docker logs myapp
