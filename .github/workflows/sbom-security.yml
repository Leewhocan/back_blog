name: SBOM Generation and Security Scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM with CycloneDX
        run: npx @cyclonedx/cyclonedx-npm@latest --output-file bom.xml

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-file
          path: bom.xml
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-file

      - name: OWASP Dependency-Check Scan via Docker
        run: |
          docker run --rm \
            -v "$(pwd):/src" \
            owasp/dependency-check:latest \
            --scan /src \
            --project "Express SBOM Demo" \
            --format SARIF \
            --format HTML \
            --out /src/dependency-check-report \
            --noupdate

      - name: Debug - List generated files
        run: ls -la dependency-check-report/ || echo "No reports generated"

      - name: Upload Dependency-Check reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: dependency-check-report/
          retention-days: 7

      - name: Upload SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          # Проверьте точное имя файла после сканирования
          sarif_file: dependency-check-report/dependency-check-report.sarif
