name: SBOM and Security Pipeline
on:
  pull_request:
    branches: [main]

jobs:
  build_and_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM with CycloneDX
        run: npx @cyclonedx/cyclonedx-npm@latest --output-file bom.xml

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        id: cache-dc
        with:
          path: ~/.dependency-check
          key: ${{ runner.os }}-dependency-check-data-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-data-

      - name: OWASP Dependency Check Scan
        run: |
          mkdir -p target
          docker run --rm \
            -v "$(pwd):/src" \
            -v "$(pwd)/target:/reports" \
            -v "$HOME/.dependency-check:/usr/share/dependency-check/data" \
            owasp/dependency-check:latest \
            --scan /src \
            --project "Express SBOM Demo" \
            --format HTML \
            --out /reports \
            --noupdate

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-file
          path: bom.xml
          retention-days: 7

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 7
